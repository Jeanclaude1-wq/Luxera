<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Luxera{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'hotels/style.css' %}">
  <script src="{% static 'hotels/script.js' %}"></script>
</head>

<body>
  <header class="main-header">
    <h1 class="logo">Luxera</h1>

    <nav class="navbar">
      <a href="{% url 'hotel_list' %}">Home</a>

      {% if user.is_authenticated %}
      <!-- LOGGED-IN USER NAV -->
      <a href="{% url 'dashboard' %}">Dashboard</a>
      <a href="{% url 'my_bookings' %}">My Bookings</a>
      <a href="{% url 'logout' %}">Logout</a>
      {% else %}
      <!-- GUEST NAV -->
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'signup' %}">Sign Up</a>
      {% endif %}
    </nav>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="main-footer">
    <p>© 2025 Luxera. All rights reserved.</p>
  </footer>
</body>

</html>
